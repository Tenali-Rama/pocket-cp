- assertVisible:
    id: nav_problemset
    selected: true
- assertVisible:
    text: "Arrives in M2: Browse.*"
- assertVisible:
    text: Problemset
    above:
      text: "Arrives in M2: Browse.*"
- runFlow:
    when:
      visible:
        id: shell_rail
    commands:
