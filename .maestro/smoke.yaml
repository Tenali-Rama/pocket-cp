# Smoke test of the app shell: launch, visit every top-level destination, return Home with Back.
# Selects by test tag only (nav_* are exposed as resource ids), so the same flow drives the
# bottom bar on phones and the navigation rail on tablets.
# A placeholder's title repeats its nav label, so each content check is anchored to the content pane:
# the placeholder message (text found nowhere in the nav) must be visible, and the title must sit
# above it. On phones the bottom bar is below the content, so `above` excludes the nav item. On
# tablets the rail item can also be above the message, so the title must also be right of the rail.
appId: app.pocketcp
name: Shell smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: nav_home
    selected: true
- assertVisible:
    text: "Arrives in M2: Browse.*"
- assertVisible:
    text: Home
    above:
      text: "Arrives in M2: Browse.*"
- runFlow:
    when:
      visible:
        id: shell_rail
    commands:
      - assertVisible:
          text: Home
          above:
            text: "Arrives in M2: Browse.*"
          rightOf:
            id: shell_rail
- takeScreenshot: smoke_home

- tapOn:
    id: nav_contests
- assertVisible:
    id: nav_contests
    selected: true
- assertVisible:
    text: "Arrives in M2: Browse.*"
- assertVisible:
    text: Contests
    above:
      text: "Arrives in M2: Browse.*"
- runFlow:
    when:
      visible:
        id: shell_rail
    commands:
      - assertVisible:
          text: Contests
          above:
            text: "Arrives in M2: Browse.*"
          rightOf:
            id: shell_rail
- takeScreenshot: smoke_contests

- tapOn:
