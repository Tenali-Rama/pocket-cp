# Smoke test of the app shell: launch, visit every top-level destination, return Home with Back.
# Selects by test tag only (nav_* are exposed as resource ids), so the same flow drives the
# bottom bar on phones and the navigation rail on tablets.
# A placeholder's title repeats its nav label, so `index: 1` asserts a second node with that text:
# the title, not just the nav item.
appId: app.pocketcp
name: Shell smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: nav_home
    selected: true
- assertVisible:
    text: Home
    index: 1
- takeScreenshot: smoke_home

- tapOn:
    id: nav_contests
- assertVisible:
    id: nav_contests
    selected: true
- assertVisible:
    text: Contests
    index: 1
- takeScreenshot: smoke_contests

- tapOn:
    id: nav_problemset
- assertVisible:
    id: nav_problemset
    selected: true
- assertVisible:
    text: Problemset
    index: 1
- takeScreenshot: smoke_problemset

- tapOn:
    id: nav_profile
- assertVisible:
    id: nav_profile
    selected: true
- assertVisible:
    text: Profile
    index: 1
- takeScreenshot: smoke_profile

- tapOn:
    id: nav_settings
- assertVisible:
    id: nav_settings
    selected: true
- assertVisible:
    text: Settings
    index: 1
- takeScreenshot: smoke_settings

- back
- assertVisible:
    id: nav_home
    selected: true
- assertVisible:
    text: Home
    index: 1
