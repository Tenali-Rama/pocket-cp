# Smoke test of the app shell: launch, visit every top-level destination, return Home with Back.
# Selects by test tag only (nav_* and the content pane's screen_* are exposed as resource ids), so the same
# flow drives the bottom bar on phones and the navigation rail on tablets, and a feature replacing a
# placeholder never edits it: the shell tags its content pane `screen_<route>` of the selected destination.
# Settings is a real feature: its Appearance category must be visible.
# `stopApp` first: clearing data of a running app can race with the relaunch and kill it. On CI,
# scripts/ci-ui-flows.sh also stops the app and waits for the system to drop its task before each flow (ADR 0014).
appId: app.pocketcp
name: Shell smoke
---
- stopApp
- launchApp:
    clearState: true
- assertVisible:
    id: nav_home
    selected: true
- assertVisible:
    id: screen_home
- takeScreenshot: smoke_home

- tapOn:
    id: nav_contests
- assertVisible:
    id: nav_contests
    selected: true
- assertVisible:
    id: screen_contests
- takeScreenshot: smoke_contests

- tapOn:
    id: nav_problemset
- assertVisible:
    id: nav_problemset
    selected: true
- assertVisible:
    id: screen_problemset
- takeScreenshot: smoke_problemset

- tapOn:
    id: nav_profile
- assertVisible:
    id: nav_profile
    selected: true
- assertVisible:
    id: screen_profile
- takeScreenshot: smoke_profile

- tapOn:
    id: nav_settings
- assertVisible:
    id: nav_settings
    selected: true
- assertVisible:
    id: screen_settings
- assertVisible:
    id: settings_category_appearance
- takeScreenshot: smoke_settings

- back
- assertVisible:
    id: nav_home
    selected: true
- assertVisible:
    id: screen_home
