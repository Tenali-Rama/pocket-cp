          text: Profile
          above:
            text: "Arrives in M9: Community.*"
          rightOf:
            id: shell_rail
- takeScreenshot: smoke_profile

- tapOn:
    id: nav_settings
- assertVisible:
    id: nav_settings
    selected: true
- assertVisible:
    text: "Arrives in M1: Data base & settings.*"
- assertVisible:
    text: Settings
    above:
      text: "Arrives in M1: Data base & settings.*"
- runFlow:
    when:
      visible:
        id: shell_rail
    commands:
      - assertVisible:
          text: Settings
          above:
            text: "Arrives in M1: Data base & settings.*"
          rightOf:
            id: shell_rail
- takeScreenshot: smoke_settings

- back
- assertVisible:
    id: nav_home
    selected: true
- assertVisible:
    text: "Arrives in M2: Browse.*"
- assertVisible:
    text: Home
    above:
      text: "Arrives in M2: Browse.*"
