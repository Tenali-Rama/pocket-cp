name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A new push supersedes a PR's run. On main every commit's run completes: cancelling one left main red (ADR 0014).
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4
      - name: Install ktlint
        run: |
          curl -fsSLo /usr/local/bin/ktlint https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x /usr/local/bin/ktlint
      - run: scripts/verify.sh --full
      # Mirrors the golden repo paths (see scripts/factory/shots.sh); agents look at these.
      - if: always() && hashFiles('scripts/ci-collect-shots.sh') != ''
        name: Collect screenshots
        run: scripts/ci-collect-shots.sh .factory/shots-out
      - if: always() && hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .factory/shots-out/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .factory/logs/

  ui:
    name: ui (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7
          - device: tablet
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "flows=$([ -x gradlew ] && [ -d .maestro ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.flows == 'yes'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: steps.has.outputs.flows == 'yes'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.has.outputs.flows == 'yes'
        name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - if: steps.has.outputs.flows == 'yes'
        run: |
          ./gradlew :app:assembleDebug
          curl -fsSL https://get.maestro.mobile.dev | bash
      - if: steps.has.outputs.flows == 'yes'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          # One Maestro run per flow, each from a settled device (ADR 0014).
          script: scripts/ci-ui-flows.sh app/build/outputs/apk/debug/app-debug.apk .maestro build/maestro
      - if: always() && steps.has.outputs.flows == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.device }}
          path: build/maestro/
          if-no-files-found: ignore

  # Spec §3 perf budgets (ADR 0013): Macrobenchmark on a tablet emulator, checked against config/perf-budgets.json.
  # Then records the Baseline Profile; app/src/main/baseline-prof.txt is copied from the baseline-profile artifact.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
      # Each script line runs on its own. Benchmarks first, so they measure the committed profile, not a fresh one.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: |
            ./gradlew :benchmark:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
            ./gradlew :app:generateBaselineProfile
      - name: Collect results
        if: always()
        run: |
          mkdir -p build/perf build/baseline-profile
          find benchmark/build/outputs -name '*benchmarkData.json' -exec cp {} build/perf/ \;
          stat -c %s app/build/outputs/apk/release/*.apk > build/perf/apk-bytes.txt
          find app/src -path '*/generated/baselineProfiles/*' -name '*.txt' -exec cp {} build/baseline-profile/ \;
      - name: Check perf budgets
        if: always()
        run: scripts/perf-budget-check.sh build/perf
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: build/perf/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: build/baseline-profile/
          if-no-files-found: ignore

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in commits
        run: |
          range=HEAD~1..HEAD
          [ "${{ github.event_name }}" = pull_request ] && range="origin/${{ github.base_ref }}..HEAD"
          if git log --format=%B "$range" \
              | grep -iqE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude'; then
            echo "::error::Remove AI attribution lines from commit messages"; exit 1
          fi
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
