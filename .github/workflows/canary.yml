name: canary
# Nightly check that our Codeforces HTML parsers still work on live pages (spec §18 Known Risks).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "ok=$([ -x gradlew ] && grep -rqs liveCanary --include=*.kts . && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.ok == 'yes'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - if: steps.has.outputs.ok == 'yes'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.has.outputs.ok == 'yes'
        run: ./gradlew liveCanary 2>&1 | tail -60 | tee canary.log; exit ${PIPESTATUS[0]}
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create canary --color B60205 2>/dev/null || true
          if [ -z "$(gh issue list --label canary --state open --json number -q '.[].number')" ]; then
            gh issue create --label canary --title "canary: live Codeforces parsing failed" \
              --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n```\n'"$(tail -40 canary.log)"$'\n```'
          fi
