name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # Signed with the release keystore when its secrets exist, else a debug-signed APK for sideloading.
      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease -Pkeystore="$RUNNER_TEMP/release.jks"
            cp app/build/outputs/apk/release/*.apk "PocketCP-${GITHUB_REF_NAME}.apk"
          else
            ./gradlew :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "PocketCP-${GITHUB_REF_NAME}-debug.apk"
          fi
      - run: gh release create "$GITHUB_REF_NAME" PocketCP-*.apk --prerelease --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
