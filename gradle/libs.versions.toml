[versions]
agp = "8.10.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.1"
hilt = "2.56.2"
detekt = "1.23.8"
ktlintGradle = "12.1.2"
# Same version as the ktlint CLI in .github/workflows/ci.yml; bump both together (build-logic/CLAUDE.md).
ktlint = "1.3.1"
androidxCore = "1.16.0"
androidxActivity = "1.10.1"
composeBom = "2025.05.01"
junit = "4.13.2"
androidxTestExt = "1.2.1"
robolectric = "4.15.1"
androidxWindow = "1.4.0"
material3Adaptive = "1.1.0"
kotlinxCoroutines = "1.10.2"
okhttp = "4.12.0"
roborazzi = "1.46.1"
retrofit = "2.11.0"
kotlinxSerialization = "1.8.1"
androidxNavigation = "2.9.0"
room = "2.7.1"
turbine = "1.2.0"
datastore = "1.1.7"
jsoup = "1.18.3"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
